services:
  freenet:
    build: .
    restart: unless-stopped
    volumes:
      - freenet:/home/freenet
    # No ports published: with stock defaults the node picks a random UDP port on
    # first boot and reaches the network by hole-punching. See README.

    # The node drains in-flight work on SIGTERM; Docker's 10s default would
    # kill it mid-drain, which entrypoint.sh would then record as a crash.
    stop_grace_period: 60s

    # entrypoint.sh does not exec the node, so PID 1 is a shell -- this puts a
    # real init behind it.
    init: true

    # Unhealthy after 5 minutes with no connections. Advisory only: Docker does
    # not act on it, and an isolated node recovers on its own -- restarting just
    # restarts the bootstrap clock.
    healthcheck:
      test: ["CMD", "peers"]
      interval: 1m
      timeout: 45s
      start_period: 2m
      retries: 5

    mem_limit: 2g

    # The node is chatty at info level, so cap what Docker keeps.
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  freenet:
