services:
  freenet:
    build: .
    restart: unless-stopped
    volumes:
      - freenet:/home/freenet
    # No ports published: with stock defaults the node picks a random UDP port on
    # first boot and reaches the network by hole-punching. See README. For a
    # stable published port instead, layer docker-compose.public.yml on top.

    # The node drains in-flight work on SIGTERM; Docker's 10s default would
    # kill it mid-drain, which entrypoint.sh would then record as a crash.
    stop_grace_period: 60s

    # entrypoint.sh does not exec the node, so PID 1 is a shell -- this puts a
    # real init behind it.
    init: true

    # Unhealthy after 15 minutes with no connections. Advisory only: Docker
    # does not act on it, and an isolated node recovers on its own -- observed
    # self-heal is well under this, so a trip here means something real.
    healthcheck:
      test: ["CMD", "peers"]
      interval: 1m
      timeout: 30s
      start_period: 5m
      retries: 10

    mem_limit: 2g

    # The node is chatty at info level, so cap what Docker keeps.
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  freenet:
