name: Publish image

# Builds the Dockerfile and pushes it to Docker Hub so docker-compose.yml can
# reference a prebuilt image instead of `build: .`. That matters on deploy
# platforms (Coolify) that otherwise rebuild on every deploy from whatever
# compose file they're pointed at.
#
# Requires two repo secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker
# Hub access token, not the account password -- create one under Docker Hub
# -> Account Settings -> Security -> New Access Token).
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - peers.sh
      - .github/workflows/publish.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            soudasuwa/freenet:main
            soudasuwa/freenet:${{ github.sha }}
